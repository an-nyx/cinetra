name: cinetra CD

on:
  push:
    branches: [ main ]

  workflow_dispatch:

concurrency:
  group: cinetra-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: status-test
          POSTGRES_DB: cinetra_status_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install pinned package manager
      run: npm install --global pnpm@10.18.3
    - name: Verify status safeguards and Web Push against isolated databases
      working-directory: backend
      env:
        DATABASE_URL: postgresql://postgres:status-test@127.0.0.1:55439/cinetra_status_test
      run: |
        pnpm install --frozen-lockfile
        pnpm prisma generate
        pnpm prisma migrate deploy
        pnpm build
        pnpm test:tracking
        pnpm test:episode-toggle
        docker exec ${{ job.services.postgres.id }} createdb -U postgres cinetra_push_test_20261110
        export DATABASE_URL=postgresql://postgres:status-test@127.0.0.1:55439/cinetra_push_test_20261110
        pnpm prisma migrate deploy
        pnpm test:notifications
    - name: Deploy and activate approved full-library reconciliation
      env:
        CINETRA_URL: https://cinetra.aniskh.com
        COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
        COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
      run: python3 scripts/deploy-status-review.py
